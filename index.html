<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日点餐 · 吃啥</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:#F6EEE3; }
  body { font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:#5B4636; min-height:100vh; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; background:#FAF4EC; padding-bottom:120px; box-shadow:0 0 40px rgba(140,100,70,.12); position:relative; }

  /* 顶栏 */
  .top-bar { display:flex; align-items:center; justify-content:center; padding:16px 16px 4px; }
  .top-bar .t-title { font-size:14px; font-weight:600; color:#A98C74; letter-spacing:3px; }

  /* 头图区 */
  .hero { padding:10px 20px 0; }
  .hero .label { display:inline-block; font-size:12px; color:#C17F59; background:#fff; border:1px solid #EBD6C2; padding:3px 12px; border-radius:999px; margin-bottom:10px; font-weight:500; }
  .hero .big { font-size:44px; font-weight:900; color:#6B4A32; letter-spacing:6px; line-height:1.15; }
  .hero .slogan { font-size:13px; color:#A98C74; margin-top:8px; }
  .hero .date { font-size:12px; color:#BDA186; margin-top:4px; }
  .hero .illus { width:100%; border-radius:20px; margin-top:14px; display:block; }
  .random-pill { display:block; width:100%; margin-top:12px; border:1.5px dashed #D9B696; background:#FFF9F1; color:#C17F59; font-size:13px; font-weight:600; padding:11px 0; border-radius:999px; cursor:pointer; }

  /* 分类药丸 */
  .pills { display:flex; gap:8px; overflow-x:auto; padding:18px 16px 6px; }
  .pills::-webkit-scrollbar { display:none; }
  .pill { flex-shrink:0; border:none; background:#F0E3D2; color:#8A6F5B; font-size:13px; padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:500; }
  .pill.active { background:#C17F59; color:#fff; font-weight:600; box-shadow:0 4px 12px rgba(193,127,89,.35); }

  /* 菜单区头部 */
  .menu-head { display:flex; align-items:flex-end; justify-content:space-between; padding:16px 16px 10px; }
  .menu-head .left .mh-title { font-size:20px; font-weight:800; color:#6B4A32; }
  .menu-head .left .mh-sub { font-size:12px; color:#BDA186; margin-top:3px; }
  .reset-btn { border:1.5px solid #E0C3A6; background:transparent; color:#C17F59; font-size:12px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; }

  /* 菜单 */
  .menu-section { padding:0 16px; }
  .section-title { font-size:14px; font-weight:700; color:#8A6F5B; margin:16px 2px 10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .dish-card { background:#fff; border-radius:18px; padding:10px; box-shadow:0 2px 10px rgba(140,100,70,.08); display:flex; flex-direction:column; }
  .dish-card.picked { outline:2px solid #C17F59; }
  .dish-img { height:104px; border-radius:14px; background:#F8EFE2; display:flex; align-items:center; justify-content:center; font-size:50px; }
  .dish-name { font-size:15px; font-weight:700; color:#6B4A32; margin-top:10px; }
  .dish-meta { font-size:11px; color:#C4A88F; margin-top:2px; }
  .dish-bottom { margin-top:10px; }
  .select-btn { width:100%; border:1.5px solid #C17F59; background:transparent; color:#C17F59; padding:8px 0; border-radius:999px; font-size:13px; cursor:pointer; font-weight:600; }
  .select-btn.selected { background:#C17F59; color:#fff; border-color:#C17F59; }
  .qty-row { display:flex; align-items:center; gap:8px; }
  .qty-row .q-info { flex:1; text-align:center; background:#C17F59; color:#fff; font-size:12px; font-weight:700; padding:8px 0; border-radius:999px; }
  .qty-btn { width:32px; height:32px; border:none; border-radius:50%; background:#F0E3D2; color:#8A6F5B; font-size:16px; font-weight:700; cursor:pointer; }
  .qty-btn:active { background:#E3CFB6; }
  .empty-tip { text-align:center; color:#C4A88F; font-size:13px; padding:40px 0; }

  /* 底部确认栏 */
  .confirm-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top,#FAF4EC 62%,rgba(250,244,236,0)); z-index:50; }
  .confirm-inner { display:flex; align-items:center; gap:12px; background:#fff; border-radius:20px; padding:10px 10px 10px 18px; box-shadow:0 6px 24px rgba(140,100,70,.18); }
  .confirm-info { font-size:13px; color:#8A6F5B; white-space:nowrap; }
  .confirm-info b { color:#C17F59; font-size:15px; }
  .confirm-btn { flex:1; border:none; background:#C17F59; color:#fff; font-size:15px; font-weight:700; padding:13px 0; border-radius:14px; cursor:pointer; }
  .confirm-btn:active { background:#B06E4B; }

  /* 弹窗通用 */
  .popup-center { display:none; position:fixed; inset:0; background:rgba(90,60,40,.45); z-index:100; align-items:center; justify-content:center; padding:24px; }
  .popup-center.show { display:flex; }
  .popup-bottom { display:none; position:fixed; inset:0; background:rgba(90,60,40,.45); z-index:100; align-items:flex-end; justify-content:center; }
  .popup-bottom.show { display:flex; }

  /* 随机推荐卡 */
  .random-card { background:#fff; border-radius:24px; padding:28px 24px; text-align:center; width:100%; max-width:320px; animation:pop .25s; }
  @keyframes pop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
  .random-card .r-emoji { font-size:60px; margin-bottom:12px; }
  .random-card .r-tag { display:inline-block; font-size:11px; color:#C17F59; background:#FAF0E5; border-radius:999px; padding:3px 10px; margin-bottom:8px; }
  .random-card .r-name { font-size:20px; font-weight:800; color:#6B4A32; margin-bottom:10px; }
  .random-card .r-desc { font-size:13px; color:#BDA186; margin-bottom:18px; line-height:1.5; }
  .random-card button { width:100%; border:none; background:#C17F59; color:#fff; font-size:14px; font-weight:700; padding:12px 0; border-radius:999px; cursor:pointer; }

  /* 下单面板 */
  .order-panel { background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:22px 20px calc(20px + env(safe-area-inset-bottom)); animation:up .25s; }
  @keyframes up { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .order-panel h2 { font-size:18px; color:#6B4A32; margin-bottom:14px; text-align:center; }
  .order-name-input { width:100%; border:1.5px solid #E0C3A6; border-radius:12px; padding:12px 14px; font-size:14px; margin-bottom:12px; outline:none; background:#FFFDF9; color:#5B4636; }
  .order-name-input:focus { border-color:#C17F59; }
  .order-item { display:flex; justify-content:space-between; font-size:14px; color:#5B4636; padding:9px 2px; border-bottom:1px dashed #F0E3D2; }
  .oi-qty { color:#C17F59; font-weight:700; }
  .order-note { width:100%; height:70px; border:1.5px solid #E0C3A6; border-radius:12px; padding:12px 14px; font-size:13px; margin:12px 0; outline:none; resize:none; background:#FFFDF9; color:#5B4636; font-family:inherit; }
  .order-note:focus { border-color:#C17F59; }
  .order-actions { display:flex; gap:10px; }
  .btn-cancel { flex:1; border:1.5px solid #E0C3A6; background:#fff; color:#8A6F5B; font-size:14px; font-weight:600; padding:12px 0; border-radius:999px; cursor:pointer; }
  .btn-confirm { flex:2; border:none; background:#C17F59; color:#fff; font-size:14px; font-weight:700; padding:12px 0; border-radius:999px; cursor:pointer; }
  .btn-confirm.submitting { opacity:.6; }

  /* 成功弹窗 */
  .success-card { background:#fff; border-radius:24px; padding:32px 28px; text-align:center; width:100%; max-width:300px; animation:pop .25s; }
  .success-card .s-emoji { font-size:56px; margin-bottom:12px; }
  .success-card .s-title { font-size:20px; font-weight:800; color:#6B4A32; margin-bottom:8px; }
  .success-card .s-sub { font-size:13px; color:#BDA186; margin-bottom:20px; line-height:1.5; }
  .success-card button { width:100%; border:none; background:#C17F59; color:#fff; font-size:14px; font-weight:700; padding:12px 0; border-radius:999px; cursor:pointer; }
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div class="t-title">今日点餐</div>
  </div>

  <div class="hero">
    <div class="label">今日点餐</div>
    <div class="big">吃啥</div>
    <div class="slogan">吃好每一顿，开心每一天</div>
    <div class="date" id="dateLine"></div>
    <button class="random-pill" id="randomBtn">&#x1F3B2; 不知道吃啥？帮我随机选一道</button>
  </div>

  <div class="pills" id="tabs">
    <button class="pill active" data-cat="all">全部</button>
    <button class="pill" data-cat="meat">&#x1F969; 荤菜</button>
    <button class="pill" data-cat="veg">&#x1F966; 素菜</button>
    <button class="pill" data-cat="staple-soup">&#x1F35A; 主食汤羹</button>
  </div>

  <div class="menu-head">
    <div class="left">
      <div class="mh-title" id="mhTitle">今日菜单</div>
      <div class="mh-sub">挑几道今天想吃的 · 共 <span id="dishCount">0</span> 道</div>
    </div>
    <button class="reset-btn" id="resetBtn">重置本餐</button>
  </div>

  <div class="menu-section" id="menuSection"></div>

  <div class="confirm-bar">
    <div class="confirm-inner">
      <div class="confirm-info">已选 <b id="cartCount">0</b> 道</div>
      <button class="confirm-btn" id="orderBtn">选好了，确认本餐 &rarr;</button>
    </div>
  </div>

</div>

<div class="popup-center" id="randomWrap">
  <div class="random-card" id="randomCard"></div>
</div>

<div class="popup-center" id="successWrap">
  <div class="success-card">
    <div class="s-emoji">&#x1F389;</div>
    <div class="s-title">下单成功！</div>
    <div class="s-sub">老板已经收到你的菜单啦<br>坐等开饭吧～</div>
    <button id="successBtn">好嘞</button>
  </div>
</div>

<div class="popup-bottom" id="orderWrap">
  <div class="order-panel" id="orderPanel"></div>
</div>

<script>
// ====== 配置区（Gitee 存储）======
var GITEE_USER = 'panlihan';
var GITEE_REPO = 'xiaozai';
var GITEE_TOKEN = 'd750e8819c86cd4f9ad5d83f4d2c2fdd';
var GITEE_BRANCH = 'master';
var API_URL = 'https://gitee.com/api/v5/repos/' + GITEE_USER + '/' + GITEE_REPO + '/contents/orders.json';
// ================================

function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str) { return decodeURIComponent(escape(atob(str.replace(/\s/g, '')))); }

// 读取订单，返回订单数组和文件 sha
function getOrders(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API_URL + '?access_token=' + GITEE_TOKEN + '&ref=' + GITEE_BRANCH, true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        callback(JSON.parse(b64decode(data.content)), data.sha);
      } catch (e) { callback([], null); }
    } else { callback([], null); }
  };
  xhr.onerror = function() { callback([], null); };
  xhr.send();
}

// 保存订单
function saveOrders(orders, sha, callback) {
  var body = 'access_token=' + encodeURIComponent(GITEE_TOKEN) +
    '&content=' + encodeURIComponent(b64encode(JSON.stringify(orders))) +
    '&message=' + encodeURIComponent('update orders') +
    '&branch=' + GITEE_BRANCH +
    '&sha=' + encodeURIComponent(sha || '');
  var xhr = new XMLHttpRequest();
  xhr.open('PUT', API_URL, true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onload = function() { callback(xhr.status === 200 || xhr.status === 201); };
  xhr.onerror = function() { callback(false); };
  xhr.send(body);
}

// 日期
(function() {
  var now = new Date();
  var weeks = ['日','一','二','三','四','五','六'];
  document.getElementById('dateLine').innerHTML =
    now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 · 星期' + weeks[now.getDay()];
})();

var dishes = [
  // 荤菜
  { id: 1, name: '老板牌红烧肉', emoji: '\uD83E\uDD69', cat: 'meat', desc: '肥而不腻，入口即化，老板的拿手菜' },
  { id: 2, name: '糖醋小排', emoji: '\uD83C\uDF56', cat: 'meat', desc: '酸酸甜甜，啃到停不下来' },
  { id: 3, name: '宫保鸡丁', emoji: '\uD83C\uDF57', cat: 'meat', desc: '花生脆脆的，鸡肉嫩嫩的' },
  { id: 6, name: '清蒸鲈鱼', emoji: '\uD83D\uDC1F', cat: 'meat', desc: '鲜嫩爽滑，营养满满' },
  { id: 8, name: '水煮牛肉', emoji: '\uD83E\uDD58', cat: 'meat', desc: '麻辣过瘾，牛肉滑嫩' },
  { id: 10, name: '口水鸡', emoji: '\uD83D\uDC14', cat: 'meat', desc: '红油香麻，看着就流口水' },
  { id: 12, name: '蒜泥白肉', emoji: '\uD83E\uDD53', cat: 'meat', desc: '蒜香浓郁，肉片薄如纸' },
  // 素菜
  { id: 4, name: '番茄炒蛋', emoji: '\uD83C\uDF73', cat: 'veg', desc: '国民第一菜，永远的神' },
  { id: 5, name: '麻婆豆腐', emoji: '\uD83C\uDF36\uFE0F', cat: 'veg', desc: '麻辣鲜香，下饭神器' },
  { id: 7, name: '干锅花菜', emoji: '\uD83E\uDD66', cat: 'veg', desc: '焦香入味，素菜也能很下饭' },
  { id: 9, name: '凉拌黄瓜', emoji: '\uD83E\uDD52', cat: 'veg', desc: '清爽解腻，夏日必备' },
  { id: 11, name: '皮蛋豆腐', emoji: '\uD83E\uDD5A', cat: 'veg', desc: '经典搭配，简单又好吃' },
  // 汤羹
  { id: 13, name: '番茄蛋花汤', emoji: '\uD83C\uDF45', cat: 'soup', desc: '酸甜开胃，暖胃首选' },
  { id: 14, name: '紫菜蛋花汤', emoji: '\uD83C\uDF3F', cat: 'soup', desc: '清淡鲜美，百喝不腻' },
  { id: 15, name: '玉米排骨汤', emoji: '\uD83C\uDF3D', cat: 'soup', desc: '炖了两个小时，鲜到掉眉毛' },
  { id: 16, name: '酸辣汤', emoji: '\uD83C\uDF5C', cat: 'soup', desc: '酸酸辣辣，喝完浑身舒坦' },
  // 主食
  { id: 17, name: '五常大米饭', emoji: '\uD83C\uDF5A', cat: 'staple', desc: '粒粒分明，香软可口' },
];

var catNames = { meat: '\uD83E\uDD69 荤菜', veg: '\uD83E\uDD66 素菜', soup: '\uD83C\uDF72 汤羹', staple: '\uD83C\uDF5A 主食' };
var pillTitles = { all: '今日菜单', meat: '荤菜', veg: '素菜', 'staple-soup': '主食汤羹' };

var cart = {};
var currentCat = 'all';

function findDish(id) {
  for (var i = 0; i < dishes.length; i++) {
    if (dishes[i].id === id) return dishes[i];
  }
  return null;
}

function renderMenu() {
  var section = document.getElementById('menuSection');
  var catMap = { all: ['meat','veg','soup','staple'], 'staple-soup': ['soup','staple'] };
  var cats = catMap[currentCat] || [currentCat];
  var html = '';
  var count = 0;
  for (var c = 0; c < cats.length; c++) {
    var cat = cats[c];
    var items = [];
    for (var i = 0; i < dishes.length; i++) {
      if (dishes[i].cat === cat) items.push(dishes[i]);
    }
    if (items.length === 0) continue;
    count += items.length;
    html += '<div class="section-title">' + catNames[cat] + '</div>';
    html += '<div class="grid">';
    for (var j = 0; j < items.length; j++) {
      var d = items[j];
      var qty = cart[d.id] || 0;
      html += '<div class="dish-card' + (qty > 0 ? ' picked' : '') + '">';
      html += '<div class="dish-img">' + d.emoji + '</div>';
      html += '<div class="dish-name">' + d.name + '</div>';
      html += '<div class="dish-meta">1人份</div>';
      html += '<div class="dish-bottom">';
      if (qty > 0) {
        html += '<div class="qty-row">';
        html += '<button class="qty-btn" onclick="changeQty(' + d.id + ',-1)">&minus;</button>';
        html += '<div class="q-info">已选 x' + qty + '</div>';
        html += '<button class="qty-btn" onclick="changeQty(' + d.id + ',1)">+</button>';
        html += '</div>';
      } else {
        html += '<button class="select-btn" onclick="changeQty(' + d.id + ',1)">选择</button>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  }
  if (count === 0) html = '<div class="empty-tip">这个分类暂时没有菜哦</div>';
  section.innerHTML = html;
  document.getElementById('dishCount').innerHTML = count;
  document.getElementById('mhTitle').innerHTML = pillTitles[currentCat] || '今日菜单';
}

function changeQty(id, delta) {
  cart[id] = (cart[id] || 0) + delta;
  if (cart[id] <= 0) delete cart[id];
  updateCart();
  renderMenu();
}

var tabBtns = document.querySelectorAll('.pill');
for (var t = 0; t < tabBtns.length; t++) {
  (function(btn) {
    btn.onclick = function() {
      for (var i = 0; i < tabBtns.length; i++) tabBtns[i].className = 'pill';
      btn.className = 'pill active';
      currentCat = btn.getAttribute('data-cat');
      renderMenu();
    };
  })(tabBtns[t]);
}

document.getElementById('resetBtn').onclick = function() {
  if (Object.keys(cart).length === 0) return;
  if (confirm('确定要重置本餐吗？已选的菜会全部清空')) {
    cart = {};
    updateCart();
    renderMenu();
  }
};

function updateCart() {
  var totalQty = 0;
  var keys = Object.keys(cart);
  for (var i = 0; i < keys.length; i++) {
    totalQty += cart[keys[i]];
  }
  document.getElementById('cartCount').innerHTML = totalQty;
}

// 随机推荐（只随机荤菜或素菜，且不与上一道重复）
var lastRandomId = null;
document.getElementById('randomBtn').onclick = function() {
  var pool = [];
  for (var i = 0; i < dishes.length; i++) {
    if (dishes[i].cat === 'meat' || dishes[i].cat === 'veg') pool.push(dishes[i]);
  }
  var candidates = [];
  for (var j = 0; j < pool.length; j++) {
    if (pool[j].id !== lastRandomId) candidates.push(pool[j]);
  }
  if (candidates.length === 0) candidates = pool;
  var d = candidates[Math.floor(Math.random() * candidates.length)];
  lastRandomId = d.id;
  var card = document.getElementById('randomCard');
  card.innerHTML = '<div class="r-emoji">' + d.emoji + '</div>' +
    '<div class="r-tag">' + (d.cat === 'meat' ? '荤菜' : '素菜') + '</div>' +
    '<div class="r-name">' + d.name + '</div>' +
    '<div class="r-desc">' + d.desc + '</div>' +
    '<button id="randomAddBtn">加进购物车</button>';
  document.getElementById('randomWrap').className = 'popup-center show';
  document.getElementById('randomAddBtn').onclick = function() {
    cart[d.id] = (cart[d.id] || 0) + 1;
    updateCart();
    renderMenu();
    document.getElementById('randomWrap').className = 'popup-center';
  };
};
document.getElementById('randomWrap').onclick = function(e) {
  if (e.target === this) this.className = 'popup-center';
};

// 下单
document.getElementById('orderBtn').onclick = function() {
  var keys = Object.keys(cart);
  var entries = [];
  for (var i = 0; i < keys.length; i++) {
    if (cart[keys[i]] > 0) entries.push({ id: parseInt(keys[i]), qty: cart[keys[i]] });
  }
  if (entries.length === 0) {
    alert('还没选菜哦~先挑几道吧');
    return;
  }
  var panel = document.getElementById('orderPanel');
  var html = '<h2>确认本餐</h2>';
  html += '<input class="order-name-input" id="orderName" placeholder="你的名字（必填）">';
  for (var i = 0; i < entries.length; i++) {
    var entry = entries[i];
    var d = findDish(entry.id);
    html += '<div class="order-item">';
    html += '<span class="oi-name">' + d.emoji + ' ' + d.name + '</span>';
    html += '<span class="oi-qty">x' + entry.qty + '</span>';
    html += '</div>';
  }
  html += '<textarea class="order-note" id="orderNote" placeholder="备注：比如少辣、多放醋、不要香菜..."></textarea>';
  html += '<div class="order-actions">';
  html += '<button class="btn-cancel" id="cancelOrderBtn">再看看</button>';
  html += '<button class="btn-confirm" id="confirmOrderBtn">确认下单</button>';
  html += '</div>';
  panel.innerHTML = html;
  document.getElementById('orderWrap').className = 'popup-bottom show';

  document.getElementById('cancelOrderBtn').onclick = function() {
    document.getElementById('orderWrap').className = 'popup-bottom';
  };
  document.getElementById('confirmOrderBtn').onclick = function() {
    var name = document.getElementById('orderName').value.trim();
    if (!name) {
      alert('请填写你的名字哦~');
      return;
    }
    var note = document.getElementById('orderNote').value.trim();
    submitOrder(name, note, entries);
  };
};
document.getElementById('orderWrap').onclick = function(e) {
  if (e.target === this) this.className = 'popup-bottom';
};

function submitOrder(name, note, entries) {
  var btn = document.getElementById('confirmOrderBtn');
  btn.innerHTML = '提交中...';
  btn.className = 'btn-confirm submitting';

  var orderItems = [];
  for (var i = 0; i < entries.length; i++) {
    var d = findDish(entries[i].id);
    orderItems.push(d.name + ' x' + entries[i].qty);
  }

  var order = {
    name: name,
    items: orderItems.join('、'),
    note: note || '无',
    time: new Date().toLocaleString('zh-CN')
  };

  // 先读取现有订单，再写入
  getOrders(function(orders, sha) {
    orders.push(order);
    saveOrders(orders, sha, function(ok) {
      if (ok) {
        showSuccess();
      } else {
        alert('提交失败，请重试');
        btn.innerHTML = '确认下单';
        btn.className = 'btn-confirm';
      }
    });
  });
}

function showSuccess() {
  document.getElementById('orderWrap').className = 'popup-bottom';
  document.getElementById('successWrap').className = 'popup-center show';
  cart = {};
  updateCart();
  renderMenu();
}

document.getElementById('successBtn').onclick = function() {
  document.getElementById('successWrap').className = 'popup-center';
};

renderMenu();
updateCart();
</script>
</body>
</html>
